services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agamotto
      POSTGRES_USER: agamotto
      POSTGRES_PASSWORD: agamotto
    ports:
      - "5432:5432"
    volumes:
      - agamotto_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agamotto -d agamotto"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://agamotto:agamotto@postgres:5432/agamotto
      JWT_SECRET: ${JWT_SECRET:-local-development-only-change-this-secret}
    command: sh -c "alembic upgrade head && python -m app.seed_demo_accounts && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  agamotto_postgres:
